<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>{{.Title}} · Callum</title>
  <script nonce="{{.Nonce}}">
    const clean = new URL(location.href);
    clean.search = '';
    clean.hash = '';
    history.replaceState(null, '', clean.href);
  </script>
  <style>
    :root {
      color-scheme: light dark;
      --background: #f7f7fb;
      --glow: #ece6ff;
      --surface: #fff;
      --text: #211d30;
      --muted: #626071;
      --line: #e7e4f0;
      --brand: #6651cf;
      --brand-wash: #f0ebff;
      --shadow: 0 24px 72px rgba(45, 35, 80, .09), 0 3px 12px rgba(45, 35, 80, .04);
      font: 16px/1.65 system-ui, -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: center;
      margin: 0;
      padding: 28px 20px;
      color: var(--text);
      background: radial-gradient(ellipse at 50% 14%, var(--glow), transparent 60%), var(--background);
    }

    main {
      width: min(100%, 460px);
      padding: clamp(22px, 7vw, 40px);
      border: 1px solid var(--line);
      border-radius: 26px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      font-size: 15px;
      font-weight: 650;
      letter-spacing: -.02em;
    }

    .brand-mark {
      display: grid;
      place-items: center;
      width: 26px;
      height: 26px;
      border-radius: 8px;
      color: #fff;
      background: #6651cf;
      font-size: 15px;
      font-weight: 720;
    }

    .message { margin: 34px 0 30px; }

    .icon {
      --icon: var(--brand);
      --icon-wash: var(--brand-wash);
      display: grid;
      place-items: center;
      width: 56px;
      height: 56px;
      color: var(--icon);
      background: var(--icon-wash);
      border-radius: 18px;
      margin-bottom: 16px;
    }

    .icon::before {
      content: "";
      width: 23px;
      height: 12px;
      transform: translateY(-2px) rotate(-45deg);
      border: solid currentColor;
      border-width: 0 0 3px 3px;
    }

    [data-status="cancelled"] .icon {
      --icon: var(--muted);
      --icon-wash: var(--background);
    }

    [data-status="cancelled"] .icon::before {
      width: 20px;
      height: 0;
      transform: none;
      border-width: 0 0 3px;
      border-radius: 8px;
    }

    [data-status="failed"] .icon {
      --icon: #a72647;
      --icon-wash: #ffeaf0;
    }

    [data-status="failed"] .icon::before {
      content: "!";
      width: auto;
      height: auto;
      border: 0;
      transform: none;
      font-size: 27px;
      line-height: 1;
      font-weight: 740;
    }

    h1 {
      font-size: clamp(24px, 7vw, 32px);
      line-height: 1.3;
      font-weight: 680;
      letter-spacing: -.035em;
      margin: 0 0 10px;
    }

    p { margin: 0; color: var(--muted); overflow-wrap: anywhere; }
    strong { font-weight: 620; color: var(--text); }

    footer {
      padding-top: 18px;
      border-top: 1px solid var(--line);
      font-size: 14px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --background: #16141d;
        --glow: #28213c;
        --surface: #211e2b;
        --text: #f3eefb;
        --muted: #b9b1c8;
        --line: #393245;
        --brand: #c4b5ff;
        --brand-wash: #312748;
        --shadow: 0 22px 70px rgba(7, 5, 13, .3);
      }
      [data-status="failed"] .icon {
        --icon: #ffa6bc;
        --icon-wash: #442834;
      }
    }

    @media (max-width: 400px) {
      .message { margin-block: 27px 24px; }
    }
  </style>
</head>
<body>
  <main data-status="{{.Status}}" aria-labelledby="result-title">
    <header class="brand"><span class="brand-mark" aria-hidden="true">C</span>Callum</header>
    <section class="message" aria-labelledby="result-title">
      <span class="icon" aria-hidden="true"></span>
      <h1 id="result-title">{{.Title}}</h1>
      {{if eq .Status "authorized"}}
      <p>已为 <strong>{{.Service}}</strong> 保存访问凭据。</p>
      {{else}}
      <p>{{.Message}}</p>
      {{end}}
    </section>
    <footer><p>{{.Hint}}</p></footer>
  </main>
</body>
</html>
