name: Verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    name: Native tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    env:
      GOTOOLCHAIN: local
      CGO_ENABLED: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Check format
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            exit 1
          fi
      - name: Vet
        run: go vet -mod=readonly ./...
      - name: Preview modernization
        run: go fix -mod=readonly -diff ./...
      - name: Native race tests
        run: go test -mod=readonly -race -timeout 60s ./...
      - name: Build without CGO
        env:
          CGO_ENABLED: '0'
        run: go build -mod=readonly -o '${{ runner.os == 'Windows' && 'bin/callum.exe' || 'bin/callum' }}' ./cmd/callum
      - name: Check working tree
        run: |
          git diff --check
          git diff --exit-code
